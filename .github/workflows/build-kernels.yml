name: Build Kernels

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      kernelsu_version:
        description: 'SukiSU 版本'
        required: true
        type: choice
        options:
          - Stable(标准)
          - Dev(开发)
        default: Stable(标准)
      kernelsu_commit:
        description: 'SukiSU commit（默认沿用已验证的 41140 配置）'
        required: false
        type: string
        default: '1cfa57340590971cba7521ed536da8ebbedc5f0a'
      susfs_commit:
        description: '覆盖所有系列的 SUSFS commit；默认留空，使用各系列固定提交'
        required: false
        type: string
        default: ''
      ksu_version_code:
        description: 'SukiSU 管理器版本号（默认 41140）'
        required: false
        type: string
        default: '41140'
      custom_version:
        description: '自定义版本名称 (可选)'
        required: false
        type: string
        default: ''
      use_zram:
        description: '启用 ZRAM (LZ4KD)'
        required: true
        type: boolean
        default: false
      use_kpm:
        description: '启用 KPM（6.6 暂不支持，自动关闭）'
        required: true
        type: boolean
        default: true
      BBG:
        description: '启用 Baseband-guard'
        required: true
        type: boolean
        default: false
      make_release:
        description: '全部成功后创建 GitHub Release'
        required: true
        type: boolean
        default: false
      send_telegram:
        description: '发布后发送 Telegram 通知'
        required: true
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.10'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      build_matrix: ${{ steps.generate.outputs.matrix }}
      release_tag: ${{ steps.generate.outputs.kernel_version }}
    steps:
      - uses: actions/checkout@v6
      - name: Generate build matrix
        id: generate
        run: python3 .github/workflows/scripts/matrix_generator.py

  build:
    name: ${{ matrix.config.android }}-${{ matrix.config.kernel }}.${{ matrix.config.sub_level }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        config: ${{ fromJson(needs.prepare.outputs.build_matrix) }}
    env:
      CONFIG_NAME: ${{ matrix.config.android }}-${{ matrix.config.kernel }}-${{ matrix.config.sub_level }}
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'false'
          remove-swapfile: 'true'
          verbose: 'false'

      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache python3 git curl wget zip unzip xz-utils openssl pixz lz4
          pip install PyYAML

      - name: Setup optional AVB signing key
        env:
          BOOT_SIGN_KEY: ${{ secrets.BOOT_SIGN_KEY }}
        run: |
          if [ -n "$BOOT_SIGN_KEY" ]; then
            umask 077
            printf '%s\n' "$BOOT_SIGN_KEY" > "$RUNNER_TEMP/boot-sign-key.pem"
            echo "BOOT_SIGN_KEY_PATH=$RUNNER_TEMP/boot-sign-key.pem" >> "$GITHUB_ENV"
          fi

      - name: Configure ccache
        run: |
          mkdir -p ~/.cache/bazel ~/.ccache
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ${{ env.CONFIG_NAME }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ env.CONFIG_NAME }}-ccache-

      - name: Build kernel
        env:
          ANDROID: ${{ matrix.config.android }}
          KERNEL: ${{ matrix.config.kernel }}
          SUB_LEVEL: ${{ matrix.config.sub_level }}
          OS_PATCH: ${{ matrix.config.os_patch }}
          REVISION: ${{ matrix.config.revision }}
          KSU_VERSION: ${{ inputs.kernelsu_version }}
          KSU_COMMIT: ${{ inputs.kernelsu_commit }}
          SUSFS_COMMIT: ${{ inputs.susfs_commit || matrix.config.susfs_commit }}
          KSU_VERSION_CODE: ${{ inputs.ksu_version_code }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          USE_ZRAM: ${{ inputs.use_zram }}
          USE_KPM: ${{ inputs.use_kpm }}
          USE_BBG: ${{ inputs.BBG }}
        run: |
          args=(--android "$ANDROID" --kernel "$KERNEL" --sub-level "$SUB_LEVEL"
                --os-patch "$OS_PATCH" --ksu-version "$KSU_VERSION" --no-release
                --output-json "$GITHUB_WORKSPACE/build-result.json")
          if [ -n "$REVISION" ]; then args+=(--revision "$REVISION"); fi
          if [ -n "$KSU_COMMIT" ]; then args+=(--ksu-commit "$KSU_COMMIT"); fi
          if [ -n "$SUSFS_COMMIT" ]; then args+=(--susfs-commit "$SUSFS_COMMIT"); fi
          if [ -n "$KSU_VERSION_CODE" ]; then args+=(--ksu-version-code "$KSU_VERSION_CODE"); fi
          if [ -n "$CUSTOM_VERSION" ]; then args+=(--custom-version "$CUSTOM_VERSION"); fi
          if [ "$USE_ZRAM" = true ]; then args+=(--zram); fi
          if [ "$USE_BBG" = true ]; then args+=(--bbg); fi
          if [ "$USE_KPM" = false ] || [ "$KERNEL" = 6.6 ]; then args+=(--no-kpm); fi
          python3 .github/workflows/scripts/build.py "${args[@]}"

      - name: Prepare artifacts
        run: |
          python3 .github/workflows/scripts/build_summary.py collect build-result.json artifacts
          (cd artifacts && sha256sum -- * > "SHA256SUMS-${CONFIG_NAME}.txt")

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ env.CONFIG_NAME }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Record build result
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
        run: |
          mkdir -p build-results
          printf '%s:outcome=%s\n' "$CONFIG_NAME" "$BUILD_STATUS" > "build-results/${CONFIG_NAME}.status"
          if [ -f build-result.json ]; then
            cp build-result.json "build-results/${CONFIG_NAME}.json"
          fi

      - name: Upload build result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-results-${{ env.CONFIG_NAME }}
          path: build-results/*
          retention-days: 14

  summary:
    needs: [prepare, build]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    outputs:
      success: ${{ steps.summary.outputs.success }}
      failed: ${{ steps.summary.outputs.failed }}
    steps:
      - uses: actions/checkout@v6
      - name: Download build results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: build-results-*
          path: build-results
          merge-multiple: true
      - name: Summarize all configurations
        id: summary
        env:
          BUILD_MATRIX: ${{ needs.prepare.outputs.build_matrix }}
          BUILD_INPUTS: ${{ toJson(inputs) }}
        run: python3 .github/workflows/scripts/build_summary.py summarize build-results RELEASE_BODY.md
      - name: Upload summary
        uses: actions/upload-artifact@v7
        with:
          name: build-summary
          path: RELEASE_BODY.md
          retention-days: 14

  release:
    needs: [prepare, build, summary]
    if: ${{ inputs.make_release && needs.build.result == 'success' && needs.summary.outputs.failed == '0' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download kernels
        uses: actions/download-artifact@v8
        with:
          pattern: kernel-*
          path: release-files
          merge-multiple: true
      - name: Download summary
        uses: actions/download-artifact@v8
        with:
          name: build-summary
          path: summary
      - name: Verify checksums
        run: |
          cd release-files
          for checksums in SHA256SUMS-*.txt; do sha256sum -c "$checksums"; done
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: GKI full matrix ${{ needs.prepare.outputs.release_tag }}
          files: release-files/*
          body_path: summary/RELEASE_BODY.md
      - name: Send Telegram notification
        if: ${{ inputs.send_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          SUCCESS: ${{ needs.summary.outputs.success }}
        run: |
          python3 .github/workflows/scripts/telegram_notify.py release \
            "$RELEASE_TAG" "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" \
            summary/RELEASE_BODY.md "" "" "$SUCCESS" "0"
